name: Build and publish desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate source and create or reuse a draft
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tag must use vMAJOR.MINOR.PATCH (for example, v0.1.0).' >&2
            exit 1
          fi

      - name: Check out the requested existing tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate release versions and record the source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/check-release.mjs
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          releases_endpoint="repos/${GITHUB_REPOSITORY}/releases?per_page=100"
          find_release() {
            gh api --paginate --slurp "$releases_endpoint" |
              jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)][0]'
          }
          release_json="$(find_release)"
          if [[ "$release_json" == 'null' ]]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "rsedit ${RELEASE_TAG}" \
              --generate-notes \
              --draft
            for attempt in {1..10}; do
              release_json="$(find_release)"
              [[ "$release_json" != 'null' ]] && break
              echo "Waiting for draft release (${attempt}/10)."
              sleep 3
            done
          fi
          if [[ "$release_json" == 'null' ]]; then
            echo 'GitHub did not return the draft release.' >&2
            exit 1
          fi
          if [[ "$(jq -r '.draft' <<< "$release_json")" != 'true' ]]; then
            echo 'Refusing to replace installers in a published release. Use a new version/tag.' >&2
            exit 1
          fi
          {
            echo "release_id=$(jq -r '.id' <<< "$release_json")"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            os: macos
            rust_target: x86_64-apple-darwin
            bundles: dmg
          - name: macOS Apple silicon
            runner: macos-14
            os: macos
            rust_target: aarch64-apple-darwin
            bundles: dmg
          - name: Linux x64
            runner: ubuntu-22.04
            os: linux
            rust_target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            os: linux
            rust_target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: Windows x64
            runner: windows-2025
            os: windows
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Windows ARM64
            runner: windows-11-arm
            os: windows
            rust_target: aarch64-pc-windows-msvc
            bundles: nsis,msi
    steps:
      - name: Check out the validated source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: release-${{ matrix.rust_target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend and Rust
        run: npm run check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust warnings
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build and upload installers to the draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Ad-hoc signing matches the sibling apps; this is not notarization.
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos' && '-' || '' }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          releaseAssetNamePattern: 'rsedit-v[version]-[platform]-[arch]-[bundle][setup][ext]'
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }} -- --locked

  verify-release:
    name: Verify all twelve draft installers
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the validated source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify uploaded installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            > "$RUNNER_TEMP/release-assets.json"
          node .github/scripts/check-release.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-assets.json"

  publish-release:
    name: Publish the complete release
    needs: [prepare, verify-release]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_url="$(gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false --jq '.html_url')"
          {
            echo "### rsedit ${RELEASE_TAG} published"
            echo "Source commit: ${SOURCE_SHA}"
            echo 'All six native builds succeeded and all twelve installers are present.'
            echo "Release: ${release_url}"
          } >> "$GITHUB_STEP_SUMMARY"
